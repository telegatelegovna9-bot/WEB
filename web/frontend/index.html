<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scolpboard Screener</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050608;
      --panel: #0d0f14;
      --panel2: #0a0c11;
      --line: #20242f;
      --txt: #d8dde8;
      --muted: #7e8799;
      --green: #23d06f;
      --red: #ff4d63;
      --orange: #cc7f5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--txt);
      font-family: JetBrains Mono, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .header {
      height: 46px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: #080a0f;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .left, .right { display: flex; align-items: center; gap: 8px; }
    .logo { font-weight: 700; letter-spacing: 1px; font-size: 15px; color: #f0f2f7; margin-right: 6px; }
    .btn {
      border: 1px solid #2c3342;
      background: #121723;
      color: #cfd6e4;
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      min-width: 28px;
      text-align: center;
    }
    .btn.active { border-color: #4e6084; background: #1a2233; }

    .app {
      width: min(1880px, 100vw);
      margin: 0 auto;
      padding: 8px;
    }

    .board {
      border: 1px solid var(--line);
      background: #0b0d12;
      border-radius: 8px;
      overflow: hidden;
    }

    .board-top {
      height: 38px;
      border-bottom: 1px solid var(--line);
      background: #0b0e15;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .board-controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 340px;
      grid-template-rows: 390px 390px;
      gap: 1px;
      background: var(--line);
    }

    .chart-card {
      background: var(--panel2);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .chart-head {
      height: 30px;
      border-bottom: 1px solid #171b24;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      font-size: 11px;
      background: #0d1017;
    }
    .chart-symbol { color: #f0f3ff; font-size: 13px; }
    .chart-stats { display: flex; gap: 8px; }
    .chart-body { position: relative; flex: 1; }
    .chart-watermark {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 60px;
      color: rgba(255,255,255,.14);
      pointer-events: none;
      letter-spacing: 1px;
    }
    canvas.mini { width: 100%; height: 100%; display: block; }

    .green { color: var(--green); }
    .red { color: var(--red); }
    .muted { color: var(--muted); }

    .sidebar {
      grid-row: 1 / span 2;
      background: #0d1016;
      border-left: 1px solid #171b24;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .side-top {
      height: 30px;
      border-bottom: 1px solid #171b24;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      font-size: 11px;
      background: #0f131b;
    }
    .table-wrap { flex: 1; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #0f141e;
      color: #9aa3b7;
      font-weight: 500;
      text-align: left;
      padding: 6px 6px;
      border-bottom: 1px solid #1b202c;
    }
    tbody td {
      padding: 6px 6px;
      border-bottom: 1px solid #11151e;
      white-space: nowrap;
    }
    tbody tr:hover { background: #121926; cursor: pointer; }

    .intel {
      margin-top: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 390px 1fr;
      background: var(--line);
      gap: 1px;
    }
    .intel-left, .intel-right { background: #0b0f16; min-height: 220px; }
    .intel-head {
      height: 30px;
      border-bottom: 1px solid #1a202b;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #a3adc3;
    }
    .signal-list { padding: 8px; display: grid; gap: 6px; max-height: 300px; overflow: auto; }
    .signal {
      border: 1px solid #242c3a;
      background: #0f1521;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .signal:hover { border-color: #47608f; }
    .score { font-weight: 700; color: #dfe6f9; }
    .explain { padding: 10px; font-size: 12px; line-height: 1.45; color: #b7bfd3; }

    @media (max-width: 1520px) {
      .layout { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 320px 320px 300px; }
      .sidebar { grid-column: 1 / -1; grid-row: auto; }
      .intel { grid-template-columns: 1fr; }
    }
    @media (max-width: 1080px) {
      .layout { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 260px) 280px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="left">
      <div class="logo">scolpboard</div>
      <div id="exchangeBtns"></div>
    </div>
    <div class="right">
      <div class="btn">1M</div>
      <div class="btn">5M</div>
      <div class="btn active">15M</div>
      <div class="btn">1H</div>
      <div class="btn">4H</div>
      <div class="btn">D</div>
      <div class="btn">RU</div>
    </div>
  </header>

  <main class="app">
    <section class="board">
      <div class="board-top">
        <div class="board-controls">
          <div class="btn active">Все</div>
          <div class="btn">⚡</div>
          <div class="btn">Объём</div>
          <div class="btn">Breakout</div>
          <div class="btn">Orderbook</div>
          <div class="btn">Listing</div>
        </div>
        <div class="board-controls">
          <div class="btn">Настройки</div>
          <div class="btn">Звук</div>
          <div class="btn">🔔</div>
        </div>
      </div>
      <div class="layout" id="layout"></div>
    </section>

    <section class="intel">
      <article class="intel-left">
        <div class="intel-head"><span>Сигналы (Live)</span><span id="signalCount">0</span></div>
        <div class="signal-list" id="signalList"></div>
      </article>
      <article class="intel-right">
        <div class="intel-head"><span>Разбор сигнала</span><span>AI explanation</span></div>
        <div class="explain" id="signalExplain">Выберите сигнал для просмотра причин, вероятности и исторических совпадений.</div>
      </article>
    </section>
  </main>

<script>
const state = {
  markets: [], signals: [], series: {}, selectedSignal: null,
  exchangeFilter: 'all', exchanges: ['all','binance','okx','bybit','mexc','gate','bitget']
};

function fmt(v){
  if(v >= 1_000_000_000) return (v / 1_000_000_000).toFixed(1) + 'B';
  if(v >= 1_000_000) return (v / 1_000_000).toFixed(1) + 'M';
  if(v >= 1_000) return (v / 1_000).toFixed(1) + 'K';
  return Number(v).toFixed(0);
}

function renderExchangeBtns(){
  const wrap = document.getElementById('exchangeBtns');
  wrap.innerHTML = state.exchanges.map(ex =>
    `<button class="btn ${state.exchangeFilter===ex?'active':''}" onclick="setExchange('${ex}')">${ex.toUpperCase()}</button>`
  ).join('');
}
window.setExchange = (ex) => { state.exchangeFilter = ex; renderExchangeBtns(); renderBoard(); }

function filteredMarkets(){
  if(state.exchangeFilter === 'all') return state.markets;
  return state.markets.filter(m => m.exchange === state.exchangeFilter);
}

function renderBoard(){
  const rows = filteredMarkets();
  const top = rows.slice(0, 6);
  const list = rows.slice(0, 120);

  const cards = top.map((m, i) => `
    <section class="chart-card">
      <div class="chart-head">
        <div><span class="chart-symbol">${m.symbol.replace('USDT','')}</span> <span class="muted">BI-F</span></div>
        <div class="chart-stats">
          <span class="${m.day_change_pct>=0?'green':'red'}">${m.day_change_pct}</span>
          <span class="muted">NATR ${m.natr}</span>
          <span class="muted">${fmt(m.volume_24h)}</span>
        </div>
      </div>
      <div class="chart-body">
        <canvas id="c${i}" class="mini"></canvas>
        <div class="chart-watermark">${m.symbol.replace('USDT','')}</div>
      </div>
    </section>
  `).join('');

  const sidebar = `
    <aside class="sidebar">
      <div class="side-top"><span>Монеты (${rows.length})</span><span class="muted">24h</span></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Тикер</th><th>Изм день</th><th>Ранг</th><th>NATR</th><th>Объём 24h</th></tr>
          </thead>
          <tbody>
            ${list.map(row => `
              <tr onclick="focusCoin('${row.symbol}')">
                <td>${row.symbol.replace('USDT','')}</td>
                <td class="${row.day_change_pct>=0?'green':'red'}">${row.day_change_pct}</td>
                <td>${row.rank}</td>
                <td>${row.natr}</td>
                <td>${fmt(row.volume_24h)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </aside>
  `;

  document.getElementById('layout').innerHTML = cards + sidebar;
  top.forEach((m, i) => drawChart(`c${i}`, m.symbol));
}

window.focusCoin = (symbol) => {
  const found = state.signals.find(s => s.symbol === symbol);
  if(found) showSignal(found.id);
}

function drawChart(id, symbol){
  const canvas = document.getElementById(id);
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(rect.width * dpr);
  canvas.height = Math.floor(rect.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const w = rect.width; const h = rect.height;
  ctx.clearRect(0,0,w,h);

  const arr = (state.series[symbol] || []).slice(-100);
  if(arr.length < 2) return;

  ctx.strokeStyle = '#141a24';
  for(let i=0;i<10;i++){
    const y = i * (h/10);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
  }

  const max = Math.max(...arr), min = Math.min(...arr);
  const up = arr[arr.length-1] >= arr[0];
  ctx.strokeStyle = up ? '#22d66f' : '#ff5166';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  arr.forEach((v, i) => {
    const x = i * (w / (arr.length - 1));
    const y = h - ((v - min) / (max - min || 1)) * h;
    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

function renderSignals(){
  document.getElementById('signalCount').textContent = state.signals.length;
  const html = state.signals.slice(0, 25).map(s => `
    <div class="signal" onclick="showSignal('${s.id}')">
      <div>
        <div><strong>${s.symbol}</strong> <span class="muted">${s.signal_type}</span></div>
        <div class="muted">${s.behavior}</div>
      </div>
      <div class="score">${s.confidence}%</div>
    </div>
  `).join('');
  document.getElementById('signalList').innerHTML = html;
  if(!state.selectedSignal && state.signals.length) showSignal(state.signals[0].id);
}

window.showSignal = (id) => {
  const s = state.signals.find(x => x.id === id);
  if(!s) return;
  state.selectedSignal = s;
  const matches = (s.historical_matches || []).slice(0, 4);
  document.getElementById('signalExplain').innerHTML = `
    <p><strong>${s.symbol} · ${s.signal_type.toUpperCase()}</strong></p>
    <p>Тип поведения: <strong>${s.behavior}</strong><br>Вероятность отработки: <strong>${s.confidence}%</strong></p>
    <p><strong>Причины:</strong><br>${s.reasons.map(r => `• ${r}`).join('<br>')}</p>
    <p><strong>Исторические совпадения:</strong><br>${matches.map(m => `• sim ${Math.round(m.similarity*100)}% → ${m.result_pct}% за ${m.horizon_hours}ч`).join('<br>') || 'Нет данных'}</p>
  `;
}

function ingestTick(tick){
  if(!state.series[tick.symbol]) state.series[tick.symbol] = [];
  state.series[tick.symbol].push(tick.price);
  if(state.series[tick.symbol].length > 350) state.series[tick.symbol].shift();
}

async function loadMarkets(){
  const res = await fetch('/api/markets');
  state.markets = await res.json();
  state.markets.forEach(m => {
    if(!state.series[m.symbol]){
      state.series[m.symbol] = [];
      for(let i=0;i<120;i++) state.series[m.symbol].push(m.price * (1 + ((Math.random()-0.5)*0.01)));
    }
  });
  renderBoard();
}

async function loadSignals(){
  const res = await fetch('/api/signals');
  state.signals = await res.json();
  renderSignals();
}

function connectStream(){
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws/stream');
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    ingestTick(msg.tick);
    if(msg.signals?.length){
      state.signals = [...msg.signals, ...state.signals].slice(0, 120);
      renderSignals();
    }
    renderBoard();
  };
  ws.onclose = () => setTimeout(connectStream, 1400);
}

renderExchangeBtns();
loadMarkets();
loadSignals();
connectStream();
setInterval(loadMarkets, 5000);
</script>
</body>
</html>
